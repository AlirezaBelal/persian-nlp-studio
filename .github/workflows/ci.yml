name: Product checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Offline JavaScript unit and structure tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Validate optional skills bootstrap syntax (do not execute)
        run: bash -n scripts/setup-codex-skills.sh

  browser:
    name: Chromium desktop and mobile smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CI-only Playwright
        run: npm install --no-save --no-package-lock '@playwright/test@1.56.1'
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify real browser UI
        run: npx playwright test --config=playwright.config.mjs
