name: Deploy product-only static site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.repository.private == false }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify product before packaging
        run: npm run check && npm test
      - uses: actions/configure-pages@v5
      - name: Stage allowlisted site files
        run: |
          set -euo pipefail
          mkdir -p _site/src _site/assets/fonts
          cp index.html tools.html styles.css tools.css unified.css favicon.svg _site/
          cp src/app.mjs src/engine.mjs src/tools.mjs src/features.mjs src/corpus-import.mjs src/legacy-redirect.mjs _site/src/
          cp assets/fonts/Vazirmatn-Variable.woff2 _site/assets/fonts/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
